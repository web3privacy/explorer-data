description: "Non-custodial crypto-to-crypto swap service. Standard swaps need
  no account and no KYC: the user enters a receiving address, sends from their
  own wallet, and a licensed third-party liquidity provider executes the swap
  and pays out to that address. The provider screens transactions and can,
  rarely, hold a flagged one and ask for verification. 700+ assets including
  Monero in both directions, at a floating rate with the fees included in the
  quote. No wallet connection, no seed phrase or private key requested."
