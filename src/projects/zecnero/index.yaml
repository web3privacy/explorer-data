id: zecnero
name: Zecnero
categories:
  - defi
description: A fair-launch fork of Zcash (Zebra) that replaces Equihash with
  RandomX proof of work, so ordinary desktop CPUs can mine it. Keeps Zcash's
  Sapling and Orchard shielded pools. No premine, presale or dev fund. Public
  testnet live since 2026-09-24; mainnet has not launched.
project_type: transaction
technology:
  type: halo2 zk-SNARK
  features:
