description: >-
  Apertrue proves that a photo or video is authentic: captured by a real camera
  or generated by a declared AI tool, and not tampered with since. It does this
  without revealing who took it, where it was taken, or what device was used.


  It does this using zero-knowledge proofs: mathematical proofs that verify a
  statement is true without revealing the underlying data. The cryptography runs
  entirely in your browser. Nothing sensitive ever leaves your device.


  The aggregated proof is verified on Aztec. Aztec is a privacy-preserving
  blockchain. Your proof is verified inside a private function. The result is an
  encrypted note that only you can read. No one else can see what you verified
  or link it to your identity.
