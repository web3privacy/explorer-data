  asset_custody_type: non-custody
  p2p: true
  connected_tx: true
  dissapearing_tx: false
licences: Apache-2.0 (iOS, Android, desktop, extension); MIT (SDK)
privacy_policy:
  defined: true
  link: https://vultisig.com/privacy
  data_usage: No personal data collected in the apps; website analytics only (anonymised IP, device/browser, referral, aggregate demographics)
tracebility:
  kyc: false
  tracked_data: Website analytics only; vault data (public keys, addresses, settings) stays on the device and is never sent to Vultisig
  sign_in_type_requirments:
    - none
default_privacy: false
audits:
  - name: Trail of Bits - DKLS23 threshold signature library (Silence Laboratories)
    url: https://github.com/silence-laboratories/dkls23/blob/main/docs/ToB-SilenceLaboratories_2024.04.10.pdf
    time: "2024-04-10"
third_party_dependency: Public RPC and price APIs; Vultisig relay server for remote device pairing (open source, local-network mediator available); third-party swap providers (THORChain, Maya, 1inch, LI.FI, KyberSwap, SwapKit, CowSwap, Jupiter)
