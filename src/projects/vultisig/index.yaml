description: Seedless, fully self-custodial multi-chain wallet secured by MPC threshold signatures (DKLS23) — no seed phrase, no single point of failure. Open source, with no account, e-mail or KYC required to use it. 30+ chains on iOS, Android, desktop and browser extension.
