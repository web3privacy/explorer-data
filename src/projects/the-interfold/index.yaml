description: The Interfold is a distributed network for confidential
  coordination. It enables independent parties to produce shared, verifiable
  outcomes from private inputs without exposing underlying data or relying on
  trusted hardware. Its Encrypted Execution Environments (E3s) support
  applications such as secret ballots, sealed-bid auctions, and confidential
  multiparty analysis.
