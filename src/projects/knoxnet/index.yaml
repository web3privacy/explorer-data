description: >-
  Knoxnet is a dual-domain blockchain enabling private, censorship-resistant
  value transfer across offline and online environments no continuous
  connectivity required.


  Knoxnet is a layer 1 privacy blockchain that works with or without the
  internet. It rethinks how blockchains execute, settle, and preserve privacy
  from the ground up.


  A blockchain where connectivity is optional.

  Built for private, peer-to-peer payments, resilient infrastructure, and a
  world that doesn’t always stay online.
