description: Coin Wallet is an open-source self-custodial multicurrency wallet
  founded in 2015 (started as Bitcoin web-only). Later expanded to iOS, Android,
  Windows, macOS and Linux. Supports 23 blockchains including Bitcoin, Monero
  (since 2021), Litecoin, Ethereum, XRP, Solana and Cardano. Full Tor support
  since 2024 (dedicated .onion site and in-app Tor routing). Optional 2FA with a
  FIDO-certified hardware security key.
