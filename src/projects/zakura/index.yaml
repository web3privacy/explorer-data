description: >-
  Zakura is a consensus-compatible Zcash full node written in Rust, built for
  scale. Supporting payments at global scale requires on the order of 50k TPS,
  which translates to consensus processing at least 100 MB/s of block data. 


  Zakura is developed by veteran protocol engineers from the Zcash, Cosmos, and
  Celestia ecosystems, as a collaboration between Valar Group and Project
  Tachyon.
