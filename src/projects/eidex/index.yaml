description: EIDEX is a non-custodial cross-chain route screener. It queries
  live quotes from 33+ sources - on-chain DEX aggregators, bridges and no-KYC
  instant exchangers - and ranks them by how much the user actually receives.
  No account or registration is required, and the swap itself is executed on
  the chosen provider's side; EIDEX never holds funds and never takes custody.
