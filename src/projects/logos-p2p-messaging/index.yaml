description: >-
  Overview: 

  Logos Messaging provides the messaging layer for the Logos stack, letting
  applications send messages, relay data, and coordinate without relying on
  centralised servers or exposing metadata to surveillance.


  It uses a peer-to-peer relay network in which messages propagate across nodes
  with no central broker, and it supports private one-to-one messaging, group
  messaging, and public broadcast channels.


  Messages can be encrypted end-to-end, and the relay network is designed to
  resist traffic analysis, making it difficult for observers to determine who is
  communicating with whom. 


  Delivery: 

  A peer-to-peer messaging network with DoS protection via RLN (Rate Limiting
  Nullifiers). Any application can use it to send and receive messages over an
  open, censorship-resistant network. 


  Chat: 

  A protocol and library that provides 1:1 and group conversations with
  end-to-end encryption using de-MLS - everything an application needs to add
  private chat without rolling its own protocol. 


  Usecases: 

  Used in Status Messenger and Railgun. 

  Formerly known as Waku. 
