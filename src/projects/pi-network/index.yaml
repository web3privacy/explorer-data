description: >-
  Pi Network is a community of tens of millions of humans mining Pi
  cryptocurrency to use and build the Web3 app ecosystem. This blockchain
  network relies on its community of Pioneers, and rewards them, through an
  innovative mobile mining mechanism, for their diverse contributions and
  digital citizenship in a clear, meritocratic  and decentralized way. 


  An accessible developer platform, combined with a large, identity-verified and
  crypto-enabled social network, positions Pi Network to become a pillar of the
  next wave of technological revolution.
