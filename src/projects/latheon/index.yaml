  - title: V7 pools after an internal review
    event_type: security
    description: >-
      An internal review found that every earlier circuit let a crafted proof
      withdraw without a deposit; fixed in V7, older pools frozen for deposits.
    time: "2026-10-27"
    link: https://github.com/latheon-network/Latheon/blob/main/STATUS.md
  - title: Payouts with an accountant's report
    event_type: release
    description: Payouts to a list of recipients, two live runs on the test chain.
    time: "2026-11-07"
    link: https://github.com/latheon-network/Latheon/blob/main/STATUS.md
