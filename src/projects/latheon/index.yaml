id: latheon
name: Latheon
categories:
  - applications
  - infrastructure
usecases:
  - dapps
  - infrastructure
ecosystem:
  - ethereum
description: >-
  Open-source zero-knowledge privacy protocol running on its own Arbitrum
  Orbit test chain (testnet only, no audit, development trusted-setup keys).
  Fixed-denomination shielded pools with Groth16 proofs bound to the recipient,
  relayer and fee; a router for arbitrary amounts; a relayer that pays the gas
  and can send a withdrawal at a random moment within a chosen window; payouts
  to a list of recipients. Disclosure is started only by the user: a report
  file, bound to one auditor's one-time code, proves which deposits are theirs
  and, for withdrawn notes, where the funds went. There is no operator or
  regulator key. Deposit addresses and amounts are public, anonymity sets are
  small, and one operator runs the test chain's sequencer, validator and
  relayer; the full list of limitations is in THREAT-MODEL.md.
project_type: Shielded pools with user-started disclosure to an auditor
have_token: false
