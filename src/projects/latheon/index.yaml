privacy_policy:
  defined: false
  link: ""
  data_usage: ""
tracebility:
  kyc: false
  tracked_data: >-
    On chain: the depositor's address, the pool (and so the amount) and the
    recipient of a withdrawal. Off chain: the RPC endpoint and the relayer see
    the caller's IP address and requests.
  sign_in_type_requirments:
    - EVM wallet
compliance: >-
  No screening of addresses. Disclosure to an auditor is optional and started
  by the user.
default_privacy: false
audits: []
third_party_dependency: >-
  Arbitrum Sepolia as the parent chain (data and settlement); a third-party
  RPC provider for reading the parent chain.
social_trust: >-
  Testnet run by one person: one sequencer, one whitelisted validator and the
  relayer are operated by the project; the trusted-setup keys come from a
  single-party development setup.
technical_spof: >-
  Single sequencer and validator; single-party trusted setup (a public
  ceremony and an independent audit are not done).
history:
