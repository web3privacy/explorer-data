description: >-
  Zafe is a Zcash multisig nobody can see. One shielded vault for your group.
  Nothing moves until enough of you approve, and on-chain it looks like any
  payment.


  Each phone holds a share of the key (FROST), and enough of them sign together.
  The chain sees one ordinary signature. Your phone checks the recipient, the
  amount and the fee before you approve. No one gathers signatures, and the
  chain doesn't show who approved.


  You set up the vault on your phones together. Each keeps a share; no one ever
  holds all of it.


  The app, the server and the spec are open source.
