description: >-
  Gloam lets people and AI agents pay each other in stablecoins privately on
  public chains. Money goes into a shielded pool, and payments inside it are
  zero-knowledge transfers (Groth16, Circom), so amounts and who paid whom stay
  off the block explorer. Deposits and withdrawals stay public.


  You can pay someone's Gloam address, send a claim link to someone who isn't
  on Gloam yet, or run private payroll. You can also prove funds, a payment or a
  payroll total to one named party with a proof that expires. Agents get the
  same through an SDK and an MCP server. Live on Tempo testnet and Robinhood
  Chain testnet. No token.
