description: >-
  Nyx aims to bring privacy to Ethereum users with minimum friction and trust.
  It helps users bridge and manage assets between their public and private
  accounts. 


  Accessing a user’s Nyx account requires both their Ethereum wallet and
  passkey. The Nyx backend helps users use Nyx across devices and browsers,
  while remaining completely agnostic to users’ asset and transaction
  information. Read below to learn the details.
