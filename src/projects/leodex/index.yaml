id: leodex
name: LeoDex
categories:
  - applications
  - defi
description: A crosschain swap aggregator with no account and no KYC. Streams live
  quotes from THORChain, Maya Protocol, Chainflip, NEAR Intents, Relay and 1inch and
  routes each swap to the best one. On supported routes no wallet connection is
  needed at all - the swap runs from a one-time deposit address, so funds can be
  sent from any wallet, exchange or cold storage. Supports shielded Zcash unified
  addresses as a swap destination.
