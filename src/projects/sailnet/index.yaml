description: >-
  A rewarded privacy network paid in XNO. Relays carry onion-routed circuits
  over ordinary-looking HTTPS and are paid per megabyte, directly, on the Nano
  ledger. No token, no accounts, no company in the middle. Censorship
  resistance: bridges, WebSocket-shaped tunnels, measured traffic shaping.
  Privacy limits, stated plainly: Sailnet cannot hide the device's MAC address
  or hostname on the local network, or the funding graph of a wallet on the
  public ledger; fund relay and client wallets from an exchange if they must
  not be linkable to you. Nothing here has been measured from inside a
  censored network yet; the measurement rig and the bridge distribution
  service are what that will be done with.
